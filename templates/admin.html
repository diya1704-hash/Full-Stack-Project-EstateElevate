<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RealEstate | Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            background: #fff;
            border-right: 1px solid #dee2e6;
            padding: 2rem;
        }
        
        .main-content {
            margin-left: 260px;
            padding: 3rem;
        }
        
        .form-box {
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h4 class="fw-bold text-primary mb-5">AdminPanel</h4>
        <nav class="nav flex-column">
            <a class="nav-link active" href="#">Dashboard</a>
            <a class="nav-link text-danger mt-5" href="/">Exit to Site</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="row g-4 mb-5">
            <div class="col-md-6">
                <div class="p-4 bg-white rounded shadow-sm">
                    <h6>Total Inquiries</h6>
                    <h2 class="fw-bold">{{ lead_count }}</h2>
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-4 bg-white rounded shadow-sm">
                    <h6>Newsletter Subs</h6>
                    <h2 class="fw-bold">{{ sub_count }}</h2>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-5">
                <div class="form-box">
                    <h5 class="fw-bold mb-4">Add Project</h5>
                    <form action="/admin/add_project" method="POST">
                        <input type="text" name="name" class="form-control mb-3" placeholder="Project Name" required>
                        <textarea name="desc" class="form-control mb-3" placeholder="Project Description"></textarea>
                        <button class="btn btn-primary w-100">Save Project</button>
                    </form>
                </div>
                <div class="form-box">
                    <h5 class="fw-bold mb-4">Add Happy Client</h5>
                    <form action="/admin/add_client" method="POST">
                        <input type="text" name="name" class="form-control mb-3" placeholder="Client Name" required>
                        <input type="text" name="designation" class="form-control mb-3" placeholder="Location/Job Title">
                        <textarea name="desc" class="form-control mb-3" placeholder="Review Text"></textarea>
                        <button class="btn btn-dark w-100">Add Testimonial</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="form-box">
                    <h5 class="fw-bold mb-4">Recent Inquiries</h5>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>City</th>
                                <th>Phone</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for l in leads %}
                            <tr>
                                <td>{{ l['name'] }}</td>
                                <td>{{ l['city'] }}</td>
                                <td>{{ l['phone'] }}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
